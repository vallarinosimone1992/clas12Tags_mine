# DIAGNOSTIC CONFIGURATION: WLS ABSORPTION/RE-EMISSION IS DISABLED.
# This exercises scintillation, interfaces, continuous fibers and readouts.
# Its collection probability is NOT a prediction for a Y-11 WLS panel.
model=monochromatic_effective
fiberModel=Y-11
sensorCount=2
fiberCount=15
diagonal=bl_tr
pitchMm=100
minBendRadiusMm=100
fiberDiameterMm=1
claddingFraction=0.02
zMcMm=0.5
readoutInsetMm=10
readoutWidthMm=20
readoutHeightMm=1.5
autoFit=1
checkOverlaps=1
nScintillator=1.58
nCore=1.59
nCladding=1.49
# Outer coating: specular (historical) | diffuse (elastic Lambertian TiO2 proxy).
# For BC-621 diffuse reference, also set reflectivity=0.92 (~425 nm).
# Constant survival probability, independent of wavelength and incidence angle.
coatingModel=specular
reflectivity=0.98
birksMmPerMeV=0.126
lightYieldPerMeV=8000
scintillationDecayNs=2.5
scintillationWavelengthNm=425
wlsWavelengthNm=476
wlsDecayNs=6.9
wlsQuantumYield=1
wlsAbsorptionLengthMm=0
bulkAbsorptionLengthMm=1000
coreAbsorptionLengthMm=0
claddingAbsorptionLengthMm=0
effectiveFiberAttenuationMm=0
