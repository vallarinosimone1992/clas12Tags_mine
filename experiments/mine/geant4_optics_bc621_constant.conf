# Historical BC-621 constant approximation; not the FNAL coextruded reference.
# Diffuse BC-621/TiO2 reference; same source as geant4_optics.conf.
# TiO2-inspired Lambertian approximation: see data/optics/coatings/README.md.
# Y-11 spectral reference: Herzkamp 2016 Fig.4.14, Table 4.4.
# L_WLS(lambda)=1/[0.0147*concentration_ppm*relative_absorption(lambda)] mm.
# Representative digitized curves, not a batch-specific measurement.
# Emission ordinate is interpreted as photon intensity/nm (source ambiguous).
# Blue scintillation remains a 425-nm proxy; QY=1 and decay=6.9ns unchanged.
# No invented long-wavelength absorption tail: see data/optics/y11/README.md.
model=spectral_y11
wlsDyeConcentrationPpm=200
wlsEmissionConvention=photon_per_nm
fiberModel=Y-11
sensorCount=2
fiberCount=15
diagonal=bl_tr
pitchMm=100
minBendRadiusMm=100
fiberDiameterMm=1
claddingFraction=0.02
zMcMm=0.5
readoutInsetMm=10
readoutWidthMm=20
readoutHeightMm=1.5
autoFit=1
checkOverlaps=1
nScintillator=1.58
nCore=1.59
nCladding=1.49
# Outer coating: specular (historical) | diffuse (elastic Lambertian TiO2 proxy).
# Constant survival probability, independent of wavelength and incidence angle.
coatingModel=diffuse
# BC-621 manufacturer plot: R(425 nm) ~0.921, rounded to 0.92.
# Constant-blue approximation; NOT a measured spectral average of FNAL emission.
# See data/optics/coatings/README.md for the strong UV dependence.
reflectivity=0.92
birksMmPerMeV=0.126
lightYieldPerMeV=8000
scintillationDecayNs=2.5
# Generation spectrum: monochromatic | fnal_extruded | ej200.
# The last two require model=spectral_y11; sources/limits: data/optics/scintillators/README.md.
# FNAL is a UV-excited fluorescence proxy, NOT a calibrated MIP emission spectrum.
# Change only the spectrum here; yield, time constants and absorption above/below stay explicit.
scintillationSpectrum=monochromatic
scintillationEmissionConvention=photon_per_nm
# Used only for monochromatic scintillation (legacy configuration fallback).
scintillationWavelengthNm=425
# wlsWavelengthNm is a nominal legacy proxy; spectral emission uses the dataset.
wlsWavelengthNm=476
wlsDecayNs=6.9
wlsQuantumYield=1
# wlsAbsorptionLengthMm is used only by monochromatic_effective.
# Intensity survival exp(-actual optical ray distance / length). Zero disables.
bulkAbsorptionLengthMm=1000
coreAbsorptionLengthMm=0
claddingAbsorptionLengthMm=0
# Kuraray spectral budget: same ordinary curve in core/cladding, WLS counted once.
# Y11 uses mean YS4/YS6 coefficients; see reference/wls_spectral_loss.md.
effectiveFiberAttenuationMm=0
fiberLossModel=kuraray_spectral
