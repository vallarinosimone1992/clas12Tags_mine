# Active phase-1 effective Y-11(200) model, single cladding, 1 mm diameter.
# Blue WLS length 0.34 mm derived at 430 nm from Herzkamp (2016), table 4.4;
# used here as an explicitly approximate near-peak proxy for 425 nm.
# Independent NOvA blue-light scaling gives ~0.30 mm at 200 ppm.
# See GEANT4_WLS_SOURCES.md. This is not axial catalogue attenuation.
# Mono emission, unity QY and disabled green reabsorption are effective hypotheses.
model=monochromatic_effective
fiberModel=Y-11
sensorCount=2
fiberCount=15
diagonal=bl_tr
pitchMm=100
minBendRadiusMm=100
fiberDiameterMm=1
claddingFraction=0.02
zMcMm=0.5
readoutInsetMm=10
readoutWidthMm=20
readoutHeightMm=1.5
autoFit=1
checkOverlaps=1
nScintillator=1.58
nCore=1.59
nCladding=1.49
# Outer coating: specular (historical) | diffuse (elastic Lambertian TiO2 proxy).
# For BC-621 diffuse reference, also set reflectivity=0.92 (~425 nm).
# Constant survival probability, independent of wavelength and incidence angle.
coatingModel=specular
reflectivity=0.98
birksMmPerMeV=0.126
lightYieldPerMeV=8000
scintillationDecayNs=2.5
scintillationWavelengthNm=425
wlsWavelengthNm=476
wlsDecayNs=6.9
wlsQuantumYield=1
wlsAbsorptionLengthMm=0.34
# Intensity survival exp(-actual optical ray distance / length). Zero disables.
bulkAbsorptionLengthMm=1000
coreAbsorptionLengthMm=0
claddingAbsorptionLengthMm=0
# Opt-in actual-path loss proxy; NOT the catalogue's axial attenuation length.
effectiveFiberAttenuationMm=0
